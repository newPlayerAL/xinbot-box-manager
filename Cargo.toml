[package]
name = "xinbot-box-manager"
version = "0.1.0"
edition = "2021"
description = "A lightweight web manager for XinBot instances on headless Linux devices"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22"
futures-util = "0.3"
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
